# =============================================================================
# Pagebound — nginx config for static Blazor WASM PWA hosting
# =============================================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---------------------------------------------------------------------------
    # MIME types
    # Setting a local types{} block in nginx overrides the inherited http{}-level
    # mime.types include — so we re-declare the standard types we need plus the
    # PWA/Blazor-specific ones.
    # ---------------------------------------------------------------------------
    types {
        text/html                          html htm;
        text/css                           css;
        text/plain                         txt;
        application/javascript             js mjs;
        application/json                   json;
        application/wasm                   wasm;
        application/manifest+json          webmanifest;
        application/xml                    xml;
        image/png                          png;
        image/jpeg                         jpg jpeg;
        image/svg+xml                      svg;
        image/x-icon                       ico;
        font/woff                          woff;
        font/woff2                         woff2;
        # Blazor framework byproducts: dlls/pdb/dat are octet-stream
        application/octet-stream           dat blat dll pdb br gz;
    }
    default_type application/octet-stream;

    # ---------------------------------------------------------------------------
    # gzip compression (Blazor WASM benefits a lot — .NET runtime is ~3 MB raw)
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---------------------------------------------------------------------------
    # Service worker: never cache (so updates land instantly)
    # ---------------------------------------------------------------------------
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /service-worker.published.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # ---------------------------------------------------------------------------
    # SPA fallback: every unknown route delivers index.html (Blazor router takes over)
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------------
    # Long cache for fingerprinted Blazor framework assets
    # ---------------------------------------------------------------------------
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
