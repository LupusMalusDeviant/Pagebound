# =============================================================================
# Pagebound — nginx config for static Blazor WASM PWA hosting
# =============================================================================

server {
    # default_server: Alpines Paket bringt einen eigenen 404-default_server mit
    # (Dockerfile entfernt ihn). Bleibt er versehentlich liegen, startet nginx so
    # gar nicht („duplicate default server") — laut statt still 404.
    listen       80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Relative Redirects: "/pdf-schwaerzen" → "/pdf-schwaerzen/" (Verzeichnis mit
    # index.html) soll hinter Caddy/TLS nicht auf http://…:80 umleiten.
    absolute_redirect off;

    # ---------------------------------------------------------------------------
    # Security-Header (M6 Security-Check). Auf statisches Blazor WASM + Tesseract-
    # OCR abgestimmt:
    #   - 'wasm-unsafe-eval' braucht die .NET-WASM-Runtime UND den Tesseract-Core
    #   - 'unsafe-inline' deckt den Pre-Boot-Theme-Script + Inline-Styles ab
    #     (XSS-Hauptpfad Markdown ist bereits HTML-frei: Markdig DisableHtml)
    #   - connect-src 'self': ALLE Ressourcen sind self-hosted — auch die Tesseract-
    #     OCR-Assets (Worker/WASM-Core in /tesseract, Sprachmodelle in /tessdata).
    #     KEIN externer Host / kein CDN → 100 % keine Außenverbindung, keine Telemetrie.
    # Greifen am Dokument (location /); Asset-Locations mit eigenem add_header
    # erben sie nicht — fürs Dokument-CSP unkritisch. In Docker smoke-testen.
    # ---------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # ---------------------------------------------------------------------------
    # MIME types
    # Setting a local types{} block in nginx overrides the inherited http{}-level
    # mime.types include — so we re-declare the standard types we need plus the
    # PWA/Blazor-specific ones.
    # ---------------------------------------------------------------------------
    types {
        text/html                          html htm;
        text/css                           css;
        text/plain                         txt;
        application/javascript             js mjs;
        application/json                   json;
        application/wasm                   wasm;
        application/manifest+json          webmanifest;
        application/xml                    xml;
        image/png                          png;
        image/jpeg                         jpg jpeg;
        image/svg+xml                      svg;
        image/x-icon                       ico;
        font/woff                          woff;
        font/woff2                         woff2;
        # Blazor framework byproducts: dlls/pdb/dat are octet-stream
        application/octet-stream           dat blat dll pdb br gz;
    }
    default_type application/octet-stream;

    # ---------------------------------------------------------------------------
    # Kompression (Bean PDF-Tool-br01, Messung: docs/findings/MESSUNG-2026-11-05-kaltstart.md)
    #
    # `dotnet publish` legt neben jedes Asset eine maximal komprimierte .br und
    # .gz. Die werden hier direkt ausgeliefert — keine CPU pro Abruf, und Brotli
    # spart beim Kaltstart gegenüber dem bisherigen Weg ~26 % (gemessen an der
    # Live-Seite: 11,09 MB zstd/Caddy → 8,21 MB br für die 210 Framework-Dateien).
    #
    #   brotli_static  .br für Clients mit „br" (alle aktuellen Browser über HTTPS).
    #                  Modul: nginx-mod-http-brotli (siehe Dockerfile). Greift auch
    #                  bei weitergeleiteten Anfragen, unabhängig von gzip_proxied.
    #   gzip_static    .gz für Clients ohne br.
    #   gzip_proxied   MUSS „any" sein: Caddy davor setzt „Via" — mit dem Standard
    #                  (off) hat nginx hinter Caddy bisher GAR NICHT komprimiert,
    #                  Caddy hat jede Antwort selbst neu gepackt (zstd/gzip).
    #   ACHTUNG        Eine ausgelieferte Datei nie nachträglich von Hand ändern
    #                  (Hotfix im Container o. ä.): nginx liefert dann weiter die
    #                  alte .br/.gz aus. Immer neu publishen.
    #   gzip on        nur noch Rückfall für Dateien ohne .gz (z. B. index.html bei
    #                  Fingerprint-freien Pfaden); Caddy reicht vorhandenes
    #                  Content-Encoding unverändert durch.
    # ---------------------------------------------------------------------------
    brotli_static on;
    gzip_static on;
    gzip_proxied any;
    gzip_vary on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml;
    # font/woff(2) bewusst NICHT: bereits komprimiert, gzip macht sie nur größer.

    # ---------------------------------------------------------------------------
    # Service worker: never cache (so updates land instantly)
    # ---------------------------------------------------------------------------
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /service-worker.published.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # ---------------------------------------------------------------------------
    # SPA fallback: every unknown route delivers index.html (Blazor router takes over)
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------------
    # Long cache for fingerprinted Blazor framework assets
    # ---------------------------------------------------------------------------
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
