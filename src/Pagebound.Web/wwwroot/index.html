<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Pagebound — schlanker, datenschutzfreundlicher Open-Source-Adobe-Reader-Ersatz." />
    <title>Pagebound</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/print-document.css" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Pagebound.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
    <script>
        // Pre-boot Theme + Sprache (FA-100/101): noch vor Blazor das gespeicherte
        // Theme/Sprache aufs <html>-Element setzen, damit der erste Paint schon
        // mit den richtigen CSS-Variablen läuft (kein Flash of Unstyled Content).
        (function () {
            try {
                var lang = window.localStorage.getItem("pb.lang");
                if (lang) document.documentElement.setAttribute("lang", lang);

                // Warm-Ink Tweaks (Theme/Akzent/Schriftgröße/Dichte/Bewegung) vor
                // dem ersten Paint anwenden — kein FOUC. Spiegelt tweaks-bridge.ts.
                var ACC = { teal: [192, 0.115], jade: [158, 0.115], aqua: [205, 0.085], coral: [35, 0.130], violet: [295, 0.105], blue: [255, 0.105], rose: [0, 0.115], amber: [70, 0.120] };
                var DEN = { kompakt: 0.82, normal: 1, luftig: 1.2 };
                var t = { theme: "dark", accent: "teal", fontScale: 1, density: "normal", motion: true };
                var raw = window.localStorage.getItem("pagebound:tweaks");
                if (raw) { var s = JSON.parse(raw); for (var k in s) t[k] = s[k]; }
                var r = document.documentElement, a = ACC[t.accent] || ACC.teal;
                r.setAttribute("data-theme", t.theme === "light" ? "light" : "dark");
                r.setAttribute("data-motion", t.motion ? "on" : "off");
                r.style.setProperty("--accent-h", a[0]);
                r.style.setProperty("--accent-c", a[1]);
                var fs = Number(t.fontScale) || 1; fs = Math.min(1.35, Math.max(0.85, fs));
                r.style.setProperty("--font-scale", fs);
                r.style.setProperty("--d", DEN[t.density] || 1);
            } catch (e) {
                // localStorage gesperrt (Privatsphäre-Modus o.ä.) — Dark-Defaults greifen.
            }
        })();
    </script>
</head>

<body class="pb-app-bg text-pb-fg antialiased">
    <div id="app">
        <div class="pb-splash">
            <img class="pb-splash-img" src="favicon.ico" alt="Pagebound" />
            <svg class="pb-splash-spinner" viewBox="0 0 50 50">
                <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="80 50"></circle>
            </svg>
            <div class="pb-splash-text">Lädt …</div>
        </div>
    </div>

    <div id="blazor-error-ui" class="pb-error-bar">
        Ein unerwarteter Fehler ist aufgetreten.
        <a href="." class="reload">Neu laden</a>
        <span class="dismiss" aria-label="Schließen">×</span>
    </div>

    <script src="js/pdfjs-bridge.js"></script>
    <script src="js/shortcuts-bridge.js"></script>
    <script src="js/storage-bridge.js"></script>
    <script src="js/pdf-manipulator-bridge.js"></script>
    <script src="js/ocr-bridge.js"></script>
    <script src="js/file-handle-bridge.js"></script>
    <script src="js/split-bridge.js"></script>
    <script src="js/workspace-bridge.js"></script>
    <script src="js/tweaks-bridge.js"></script>
    <script src="js/wysiwyg-editor.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Service-Worker + sanftes Update-Handling.
        // Der SW (service-worker.published.js) macht skipWaiting()+clients.claim(),
        // d. h. eine neue Version übernimmt nach einem Deploy automatisch. Die bereits
        // GEÖFFNETE Seite läuft aber noch mit dem alten WASM-Code (+ den i18n-Bundles,
        // die network-first frisch geladen werden) — Stand-Mismatch. Statt hart neu zu
        // laden (würde ungespeicherte Annotationen/Designer-Entwürfe verwerfen) zeigen
        // wir einen dezenten "Neue Version verfügbar"-Hinweis; Neu-Laden entscheidet der Nutzer.
        if ('serviceWorker' in navigator) {
            // Kontrollierte der SW die Seite schon beim Laden? Nur dann ist ein späterer
            // controllerchange ein echtes Update — nicht die Erstinstallation.
            var pbWasControlled = !!navigator.serviceWorker.controller;
            var pbReloading = false;

            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });

            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (!pbWasControlled || pbReloading) return; // Erstinstallation / schon am Neuladen
                pbShowUpdateBanner();
            });

            // Lange offene Tabs: stündlich aktiv nach einem Update schauen.
            setInterval(function () {
                navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update(); });
            }, 60 * 60 * 1000);

            function pbShowUpdateBanner() {
                if (document.getElementById('pb-update-banner')) return;
                var de = (document.documentElement.getAttribute('lang') || navigator.language || 'de').toLowerCase().indexOf('de') === 0;
                var bar = document.createElement('div');
                bar.id = 'pb-update-banner';
                bar.setAttribute('role', 'status');
                bar.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:99999;display:flex;gap:.75rem;align-items:center;max-width:92vw;padding:.7rem .9rem;border-radius:10px;background:#0f172a;color:#f8fafc;box-shadow:0 10px 30px rgba(0,0,0,.35);font:500 14px/1.4 system-ui,-apple-system,sans-serif;border:1px solid rgba(248,250,252,.15)';
                var txt = document.createElement('span');
                txt.textContent = de ? 'Neue Version verfügbar.' : 'A new version is available.';
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = de ? 'Neu laden' : 'Reload';
                btn.style.cssText = 'cursor:pointer;border:0;border-radius:7px;padding:.45rem .8rem;font:600 14px system-ui,sans-serif;background:#14b8a6;color:#04201c';
                btn.onclick = function () { pbReloading = true; location.reload(); };
                var dismiss = document.createElement('button');
                dismiss.type = 'button';
                dismiss.setAttribute('aria-label', de ? 'Schließen' : 'Dismiss');
                dismiss.textContent = '×';
                dismiss.style.cssText = 'cursor:pointer;border:0;background:transparent;color:#94a3b8;font-size:18px;line-height:1;padding:0 .25rem';
                dismiss.onclick = function () { bar.remove(); };
                bar.appendChild(txt); bar.appendChild(btn); bar.appendChild(dismiss);
                document.body.appendChild(bar);
            }
        }
    </script>
</body>

</html>
