# =============================================================================
# Gegenspieler für RedirectingServerTests — NICHT für die Auslieferung.
#
# Ein zweiter server-Block im selben Auslieferungs-Image (CI: als zusätzliche
# Datei nach /etc/nginx/http.d/ gemountet). Er reicht alles an den echten
# Block auf :80 durch, leitet aber jedes .../index.html per 301 auf das
# Verzeichnis um — so wie es viele Server und Proxys tun („saubere URLs"),
# und wie es `npx serve` in der alten CI tat.
#
# Genau das legte die App für wiederkehrende Besucher lahm: der Service Worker
# cachte die umgeleitete Antwort unter index.html, und eine umgeleitete Antwort
# darf keine Navigation beantworten (net::ERR_FAILED).
# =============================================================================
server {
    listen 81;
    server_name _;
    absolute_redirect off;

    location ~ ^(?<dir>.*/)index\.html$ {
        return 301 $dir;
    }

    location / {
        proxy_pass http://127.0.0.1:80;
    }
}
