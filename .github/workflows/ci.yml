name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/Pagebound.Web/package-lock.json

      # Privacy-Guard (F-20): schlägt fehl bei externen Requests / CDN-Assets /
      # deaktivierter NoOp-Telemetrie / unreviewten Laufzeit-Dependencies.
      # Dependency-frei (nur Node-Builtins) → früher, schneller Gate.
      - name: Privacy guard (no external requests / telemetry)
        run: node tools/privacy-check.mjs

      # Die Landingpages, sitemap.xml, robots.txt und llms.txt sind eingecheckte
      # Ausgabe von tools/gen-landing.mjs. Wer die Texte im Skript ändert und das
      # Neu-Erzeugen vergisst (oder das HTML von Hand ändert), wird hier rot.
      # Läuft vor jedem Build-Schritt, der wwwroot anfasst.
      #
      # Geprüft wird in BEIDEN Richtungen. Der Inhaltsvergleich allein genügt
      # nicht: Wird ein Slug umbenannt und alles neu erzeugt und eingecheckt,
      # bleibt die ALTE Seite im Repo liegen (der Generator löscht nichts). Sie
      # wäre aus sitemap.xml und den Querverweisen verschwunden, würde aber
      # weiter ausgeliefert — und landing.test.mjs hielte sie für eine gültige
      # Seite. Deshalb zusätzlich: jede eingecheckte …/index.html unterhalb von
      # wwwroot muss eine sein, die der Generator geschrieben hat.
      # LASTMOD im Generator bleibt von Hand gepflegt (Reproduzierbarkeit, keine
      # Systemuhr) — dass es zum Inhalt passt, prüft hier nichts.
      - name: Landing pages up to date (gen-landing.mjs)
        run: |
          node tools/gen-landing.mjs src/Pagebound.Web/wwwroot | sort > /tmp/landing-written
          # Jede eingecheckte Seite unterhalb von wwwroot (die App-eigene
          # wwwroot/index.html hat nach dem Abschneiden des Präfixes keinen
          # Schrägstrich und fällt damit heraus).
          git ls-files --full-name -- src/Pagebound.Web/wwwroot \
            | sed 's|^src/Pagebound\.Web/wwwroot/||' \
            | grep -E '^.+/index\.html$' | sort > /tmp/landing-tracked
          orphans=$(comm -13 /tmp/landing-written /tmp/landing-tracked)
          # Inhalt vergleichen: git diff normalisiert die Zeilenenden über
          # „* text=auto" in .gitattributes. Neue, nicht eingecheckte Dateien
          # eigens suchen — git diff sieht sie nicht.
          new=$(git ls-files --others --exclude-standard -- src/Pagebound.Web/wwwroot)
          if ! git diff --quiet -- src/Pagebound.Web/wwwroot || [ -n "$new" ] || [ -n "$orphans" ]; then
            echo "Eingecheckte Landingpages weichen von tools/gen-landing.mjs ab:"
            git diff --stat -- src/Pagebound.Web/wwwroot
            [ -z "$new" ] || echo "Neu, nicht eingecheckt: $new"
            [ -z "$orphans" ] || echo "Eingecheckt, aber nicht mehr erzeugt (löschen): $orphans"
            git diff -- src/Pagebound.Web/wwwroot | head -50
            exit 1
          fi

      - name: Restore .NET packages
        run: dotnet restore

      - name: Install npm packages
        working-directory: src/Pagebound.Web
        run: npm ci

      # esbuild transpiliert nur — es prüft KEINE Typen. Ohne diesen Schritt geht
      # ein Typfehler in den ~8k Zeilen Interop-Bridges grün durch die CI und
      # fällt erst im Browser auf; Pagebound.Web.Tests deckt sie nicht ab.
      # Läuft VOR dem Bundle-Build, damit es früh und mit klarer Meldung scheitert.
      # Lokal: npm run typecheck (im Ordner src/Pagebound.Web).
      - name: Typecheck JS bridges (tsc --noEmit)
        working-directory: src/Pagebound.Web
        run: npm run typecheck

      - name: Build CSS + JS bridges
        working-directory: src/Pagebound.Web
        run: npm run build

      # Bridge-Tests in Node: echte pdf-lib-Bridge-Funktionen, nachgemessen mit
      # PDF.js (gleicher Viewport wie der Reader) — u. a. gedrehte Seiten/CropBox.
      - name: JS bridge tests (node --test)
        working-directory: src/Pagebound.Web
        run: npm test

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run unit & component tests
        # E2E (Playwright) laufen im dedizierten e2e-tests-Job mit echtem Server —
        # hier ausschließen, sonst würden sie mangels Server nur (grün) übersprungen.
        run: dotnet test --configuration Release --no-build --filter "FullyQualifiedName!~E2ETests" --settings coverlet.runsettings --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"

      # Die App läuft im Browser ohne ICU (InvariantGlobalization) — Core-Logik
      # (Sortierung, Formate) hier zusätzlich genau so prüfen.
      - name: Core tests in invariant globalization mode (wie im Browser)
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
        run: dotnet test tests/Pagebound.Core.Tests --configuration Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: '**/coverage.cobertura.xml'

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test
    # Die Tests laufen gegen das ECHTE Auslieferungs-Image (nginx + Brotli aus
    # infra/docker/nginx.conf), nicht gegen einen Wegwerf-Server.
    #
    # Vorher: `npx serve -s ./publish/wwwroot`. serve leitet /index.html per 301
    # auf /index um („cleanUrls"). Der Service Worker legt diese umgeleitete
    # Antwort unter index.html im Cache ab, und eine umgeleitete Antwort darf
    # laut Spezifikation keine Navigation beantworten — Chrome bricht mit
    # net::ERR_FAILED ab, sobald der SW aktiv ist. Dieser Job war auf main
    # dauerhaft rot, ohne dass im Produktpfad etwas kaputt war.
    #
    # Umgekehrt hat der Wegwerf-Server einen ECHTEN Fehler verdeckt: im Image
    # fehlten boot.js und lazy-bridges.js (pauschaler .dockerignore-Ausschluss),
    # im Runner-Publish lagen sie. Gegen das Image fällt so etwas auf.
    #
    # Node und `dotnet publish` braucht der Job nicht mehr: das Image baut CSS,
    # JS-Bridges und WASM selbst, und Pagebound.E2ETests hat keine
    # Projektreferenz.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build E2E test project
        run: dotnet build tests/Pagebound.E2ETests --configuration Release

      - name: Install Playwright browsers
        run: pwsh tests/Pagebound.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Build delivery image
        run: docker build -t pagebound:e2e .

      - name: Start container
        run: |
          docker run -d --name pb-e2e -p 5000:80 pagebound:e2e
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5000/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:5000/ \
            || { echo "Container antwortet nicht auf /"; docker logs pb-e2e; exit 1; }

      - name: Start redirecting adversary
        # Dasselbe Image mit einem zweiten server-Block, der jedes .../index.html
        # per 301 umleitet (tests/Pagebound.E2ETests/redirect-adversary.nginx.conf).
        # Gegen ihn läuft RedirectingServerTests — der Regressionstest für die
        # Redirect-Härtung im Service Worker.
        run: |
          docker run -d --name pb-redirect -p 5001:81 \
            -v "$PWD/tests/Pagebound.E2ETests/redirect-adversary.nginx.conf:/etc/nginx/http.d/zz-redirect-adversary.conf:ro" \
            pagebound:e2e
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5001/ && break
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5001/index.html)
          [ "$code" = 301 ] \
            || { echo "Gegenspieler leitet /index.html nicht um (HTTP $code)"; docker logs pb-redirect; exit 1; }

      - name: Smoke the container
        # Belegt VOR den Browser-Tests, dass das Image vollständig ist — u. a.,
        # dass jedes <script src> aus index.html als JavaScript ankommt. Ohne
        # diesen Schritt zeigt sich eine fehlende Datei nur als rätselhafter
        # Playwright-Fehler irgendwo mitten in der Suite.
        run: bash infra/docker/smoke.sh http://localhost:5000

      - name: Run E2E tests
        env:
          PAGEBOUND_URL: http://localhost:5000
          PAGEBOUND_REDIRECT_URL: http://localhost:5001
          # Kein stilles Wegskippen: fällt Server oder Browser aus, wird der Job
          # rot statt grün (Leitplanke in CLAUDE.md).
          PAGEBOUND_REQUIRE_SERVER: "1"
        run: dotnet test tests/Pagebound.E2ETests --configuration Release --no-build

      - name: Container logs
        if: always()
        run: |
          docker logs pb-e2e
          echo "--- pb-redirect"
          docker logs pb-redirect || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/Pagebound.E2ETests/playwright-report

  lighthouse:
    name: Lighthouse A11y Audit
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build & publish
        run: |
          cd src/Pagebound.Web
          npm ci
          npm run build
          cd ../..
          dotnet publish src/Pagebound.Web --configuration Release --output ./publish

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@latest
          # Reines ACCESSIBILITY-Gate: nur die Accessibility-Kategorie asserten,
          # KEIN lighthouse-Preset. Das Preset prüft die komplette Performance-
          # Kategorie als Fehler (max-potential-fid, render-blocking, TBT …), die
          # eine Blazor-WASM-Standalone-App prinzipiell nicht erfüllt — der WASM-
          # Boot blockiert den Main-Thread. Hier zählt Barrierefreiheit, nicht Perf.
          lhci autorun --collect.staticDistDir=./publish/wwwroot --assert.assertions.categories:accessibility=">=0.9"

  mcp-server:
    name: MCP server (build + smoke)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mcp/package-lock.json

      - name: Build + smoke (pagebound-pdf-mcp-server)
        working-directory: mcp
        run: |
          npm ci
          npm run build
          npm run smoke

  docker-image:
    name: Docker image smoke (nginx + Brotli)
    runs-on: ubuntu-latest
    # Baut das echte Auslieferungs-Image und prüft, was ein Browser bekommt:
    # .br/.gz aus dem Publish (auch mit Via-Header wie hinter Caddy), Typen, CSP,
    # Landingpages, SPA-Fallback. Läuft auch auf PRs — publish-image.yml baut
    # erst auf main/Tags, ein kaputtes Image fiele sonst erst nach dem Push auf.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pagebound:ci .

      - name: Start container
        run: |
          docker run -d --name pb -p 8088:80 pagebound:ci
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8088/ && break
            sleep 1
          done

      - name: Selbsttest Script-Parser
        run: bash infra/docker/script-srcs.test.sh

      - name: Smoke (Kompression, Header, Routen)
        run: bash infra/docker/smoke.sh http://localhost:8088

      - name: Container logs
        if: always()
        run: docker logs pb
