name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/Pagebound.Web/package-lock.json

      - name: Restore .NET packages
        run: dotnet restore

      - name: Install npm packages
        working-directory: src/Pagebound.Web
        run: npm ci

      - name: Build CSS + JS bridges
        working-directory: src/Pagebound.Web
        run: npm run build

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run unit & component tests
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: '**/coverage.cobertura.xml'

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore .NET packages
        run: dotnet restore

      - name: Install Playwright browsers
        run: |
          dotnet build tests/Pagebound.E2ETests --configuration Release
          pwsh tests/Pagebound.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Build CSS + JS bridges
        working-directory: src/Pagebound.Web
        run: |
          npm ci
          npm run build

      - name: Run E2E tests
        run: dotnet test tests/Pagebound.E2ETests --configuration Release --no-build

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/Pagebound.E2ETests/playwright-report

  lighthouse:
    name: Lighthouse A11y Audit
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build & publish
        run: |
          cd src/Pagebound.Web
          npm ci
          npm run build
          cd ../..
          dotnet publish src/Pagebound.Web --configuration Release --output ./publish

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@latest
          lhci autorun --collect.staticDistDir=./publish/wwwroot --assert.preset=lighthouse:no-pwa --assert.assertions.categories:accessibility=">=0.90"
